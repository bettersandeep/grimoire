name: grimoire
version: "0.4.1"
description: "Learn and explore your data with fewer tokens: ask questions about CSV, JSON, Parquet and SQLite files, and every number in the answer comes from a real query."
author: Sandeep Singh
requires_hermes: ">=0.23.0"
provides_tools:
  - grimoire_attach
  - grimoire_profile
  - grimoire_query
  - grimoire_note
  - grimoire_merge
  - grimoire_catalog
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - transform_llm_output
