name: grimoire
version: "0.26.0"
description: "Learn and explore your data with fewer tokens: ask questions about CSV, JSON, Parquet and SQLite files, and Grimoire flags any number in the answer that no query produced."
author: Sandeep Singh
requires_hermes: ">=0.23.0"
provides_tools:
  - grimoire_attach
  - grimoire_profile
  - grimoire_query
  - grimoire_drivers
  - grimoire_compare
  - grimoire_note
  - grimoire_merge
  - grimoire_catalog
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - transform_llm_output
