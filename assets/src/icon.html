<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:512px;height:512px;background:transparent;overflow:hidden}
.tile{position:absolute;inset:0;border-radius:112px;overflow:hidden;background:#0a0a0a}
.grid{position:absolute;inset:0;background-image:linear-gradient(#2a55ff2e 1px,transparent 1px),linear-gradient(90deg,#2a55ff2e 1px,transparent 1px);background-size:32px 32px}
.sun{position:absolute;left:150px;top:64px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#f04a37,#d42d21 72%,#b3221a)}
.hermes{position:absolute;inset:0;background:url(hermes-trismegistus-1675.svg) no-repeat;background-size:1030px 1329px;background-position:-150px -120px;
  filter:invert(1) sepia(.2) brightness(.95);mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 62% 70% at 55% 42%,#000 55%,transparent 92%)}
.g{position:absolute;height:18px}.y{background:#ffd60a}.b{background:#2a55ff}
.ring{position:absolute;inset:0;border-radius:112px;box-shadow:inset 0 0 0 3px #ffffff14}
</style></head><body><div class="tile">
<div class="grid"></div><div class="sun"></div><div class="hermes"></div>
<div class="g y" style="left:40px;top:300px;width:170px"></div><div class="g b" style="left:96px;top:318px;width:120px"></div>
<div class="g b" style="left:300px;top:404px;width:170px"></div><div class="g y" style="left:350px;top:422px;width:120px;height:12px"></div>
<div class="ring"></div></div></body></html>
