<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box;margin:0}
:root{--night:#0c0816;--violet:#7c5cff;--mint:#43e0c0;--gold:#f3d58a;--parch:#f4ead2}
body{width:1200px;height:600px;overflow:hidden;position:relative;background:radial-gradient(900px 600px at 70% 40%,#22164a 0%,#120c26 45%,var(--night) 80%);font-family:"Geist",sans-serif;color:var(--parch)}
.layer{position:absolute;inset:0}
.grid{background-image:linear-gradient(#7c5cff16 1px,transparent 1px),linear-gradient(90deg,#7c5cff16 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 70% 45%,#000 30%,transparent 80%)}
.moon{position:absolute;left:660px;top:40px;width:520px;height:520px;border-radius:50%;background:#efe3c4;box-shadow:0 0 0 3px #f3d58a,0 0 0 12px #7c5cff55,0 0 0 13.5px #43e0c0aa,0 0 140px 40px #7c5cff55;overflow:hidden}
.wiz{position:absolute;inset:0;background:url(merlin-pyle-1903.jpg) no-repeat;background-size:524px 602px;background-position:-6px 24px;mix-blend-mode:multiply;filter:sepia(.45) contrast(1.08)}
.glitch div{position:absolute;height:8px}
.v{background:var(--violet)}.m{background:var(--mint)}.g{background:var(--gold)}
.left{position:absolute;left:68px;top:84px;width:560px}
.kicker{font:600 13px "Geist Mono",monospace;letter-spacing:3.5px;color:var(--mint)}
h1{font:600 138px/0.92 "Geist Serif",serif;letter-spacing:-4px;margin:16px 0 20px;color:var(--parch);text-shadow:0 0 40px #7c5cff55}
.tag{font:400 25px/1.4 "Geist",sans-serif;color:#cfc6e6;max-width:520px}.tag b{color:var(--parch);font-weight:600}
.slip{position:absolute;left:68px;top:432px;display:flex;gap:28px;align-items:center;font:500 14px/1.6 "Geist Mono",monospace;color:#b9b0d6;
  border:1.5px solid #7c5cff88;background:#120c26cc;padding:12px 18px;border-radius:4px}
.slip .h{color:var(--mint);font-weight:600;letter-spacing:2px;font-size:12px}
.slip .bad{color:#ff7a6e;text-decoration:line-through;text-decoration-thickness:1.5px}.slip .ok{color:var(--gold);font-weight:600}
.foot{position:absolute;left:68px;bottom:30px;font:400 13px "Geist Mono",monospace;color:#8f86b3}
.stream{position:absolute;inset:0;pointer-events:none}
.noise{opacity:.28;mix-blend-mode:overlay}
</style></head><body>
<div class="layer grid"></div>
<svg class="layer" width="1200" height="600"><g fill="#f4ead2"><circle cx="40" cy="30" r="1" opacity="0.6"/><circle cx="210" cy="58" r="1.3" opacity="0.5"/><circle cx="380" cy="24" r="0.9" opacity="0.7"/><circle cx="560" cy="70" r="1.1" opacity="0.5"/><circle cx="600" cy="520" r="1" opacity="0.5"/><circle cx="120" cy="540" r="1.2" opacity="0.4"/><circle cx="470" cy="560" r="0.9" opacity="0.6"/><circle cx="1180" cy="580" r="1" opacity="0.5"/><circle cx="1170" cy="40" r="1.2" opacity="0.6"/><circle cx="330" cy="500" r="0.8" opacity="0.5"/><circle cx="640" cy="20" r="1" opacity="0.6"/><circle cx="20" cy="300" r="1" opacity="0.4"/></g></svg>
<div class="moon"><div class="wiz"></div></div>

  <path id="p1" d="M500 452 C 560 470, 610 360, 700 352 S 760 330, 790 318"/>
  <path id="p2" d="M520 478 C 600 500, 650 400, 720 384 S 770 360, 800 345"/></defs>

    <text font-size="15" fill="#43e0c0" opacity=".95"><textPath href="#p1">1,091 ✓ · q65 · SUM(units) · SELECT</textPath></text>
    <text font-size="12" fill="#f3d58a" opacity=".8"><textPath href="#p2" startOffset="6%">LIMIT 1 · ORDER BY 2 DESC · GROUP BY 1</textPath></text>
  </g>
  <g fill="#f3d58a" filter="url(#glow)"><circle cx="804" cy="330" r="2.4"/><circle cx="770" cy="300" r="1.6"/><circle cx="728" cy="330" r="1.8"/><circle cx="660" cy="372" r="1.4"/><circle cx="610" cy="420" r="1.7"/><circle cx="560" cy="440" r="1.2"/></g>
</svg>

  <div class="m" style="left:1060px;top:240px;width:120px"></div><div class="v" style="left:1100px;top:249px;width:90px;height:5px"></div>
  <div class="g" style="left:1010px;top:470px;width:140px;height:6px"></div><div class="v" style="left:1040px;top:478px;width:140px"></div>
</div>
<div class="left">
  <div class="kicker">A HERMES AGENT PLUGIN · BY BETTERSANDEEP</div>

</div>

</body></html>
