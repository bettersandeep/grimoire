<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:600px;overflow:hidden;position:relative;background:radial-gradient(900px 520px at 30% 45%,var(--paper),var(--paper2) 85%);color:var(--ink);font-family:"Geist",sans-serif}
.tex{position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply}
.left{position:absolute;left:72px;top:92px;width:600px}
.kicker{font:600 14px "Geist Mono",monospace;letter-spacing:3.5px;text-transform:uppercase;color:var(--teal)}
h1{font:600 148px/0.95 "Geist Serif",serif;letter-spacing:-4px;margin:18px 0 22px;color:var(--ink)}
.tag{font:400 27px/1.38 "Geist",sans-serif;color:var(--ink2);max-width:540px}
.tag b{font-weight:600;color:var(--ink)}
.rule{width:64px;height:2px;background:var(--teal);margin:30px 0 18px}
.meta{font:400 15px "Geist Mono",monospace;color:var(--ink2);letter-spacing:.3px}
.meta span{color:var(--teal);margin:0 8px}
.page{position:absolute;right:76px;top:44px;width:340px;height:500px;border-radius:170px 170px 6px 6px;background:#f7f2e6;
  box-shadow:0 0 0 1.5px var(--ink),0 0 0 7px #f7f2e6,0 0 0 8.5px var(--teal),0 24px 50px #2a201033;overflow:hidden}
.page .fig{position:absolute;inset:0;background:url(hermes-trismegistus-1675.svg) no-repeat;background-size:560px 723px;background-position:-60px -50px;mix-blend-mode:multiply;filter:sepia(.35) contrast(1.05)}
.slip{position:absolute;left:640px;top:350px;width:300px;padding:16px 18px 22px;background:#fffdf7;transform:rotate(-4deg);
  box-shadow:0 14px 30px #2a20103d,0 1px 0 #0001;font:400 14px/1.7 "Geist Mono",monospace;color:var(--ink);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.slip .h{font-weight:600;letter-spacing:2px;color:var(--teal);font-size:12px;margin-bottom:6px}
.slip .bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.slip .ok{color:var(--teal);font-weight:600}
.slip .sql{font-size:11.5px;color:var(--ink2);border-top:1px dashed #16211f40;margin-top:8px;padding-top:6px}
.foot{position:absolute;left:72px;bottom:34px;font:400 13px "Geist Mono",monospace;color:var(--ink2);letter-spacing:.5px}
</style></head><body>
<svg class="tex" width="1200" height="600"><filter id="p"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#p)"/></svg>
<div class="left">
  <div class="kicker">A Hermes Agent plugin · by bettersandeep</div>
  <h1>Grimoire</h1>
  <p class="tag">Ask your data files anything. <b>Every number in the answer has a receipt.</b></p>
  <div class="rule"></div>
  <div class="meta">CSV<span>·</span>Parquet<span>·</span>JSON<span>·</span>SQLite<span>/</span>DuckDB, local, read-only</div>
</div>
<div class="page"><div class="fig"></div></div>
<div class="slip">
  <div class="h">RECEIPT · Q65</div>
  <div>answer &nbsp;<span class="bad">10,911</span> units ✗</div>
  <div>query &nbsp;&nbsp;<span class="ok">1,091</span> units ✓</div>
  <div class="sql">SELECT category, SUM(units) …</div>
</div>
<div class="foot">github.com/bettersandeep/grimoire</div>
</body></html>
