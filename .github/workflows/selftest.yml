name: selftest
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"  # the floor in pyproject.toml
            duckdb: "duckdb==1.4.2"  # the floor
          - python: "3.13"
            duckdb: "duckdb>=1.5,<2"  # the last 1.x
          - python: "3.13"
            duckdb: "duckdb>=2,<3"  # the newest allowed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: grimoire
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.duckdb }}" "pytest>=8,<10"
      - run: python -m pytest -q -W error::DeprecationWarning grimoire
